services:
  nats:
    image: nats:2.10-alpine
    container_name: shop-nats
    command: ["--jetstream", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - shop-network
    restart: unless-stopped

networks:
  shop-network:
    name: shop-network
    driver: bridge